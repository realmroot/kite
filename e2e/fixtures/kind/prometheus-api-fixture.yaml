apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kite-prometheus-api
  namespace: monitoring
data:
  default.conf: |
    server {
      listen 9090;
      default_type application/json;

      location = /-/ready {
        return 200 'ready';
      }

      location = /api/v1/status/config {
        return 200 '{"status":"success","data":{"yaml":"global: {}"}}';
      }

      location = /api/v1/query_range {
        return 200 '{"status":"success","data":{"resultType":"matrix","result":[{"metric":{},"values":[[1787212800,"1.5"]]}]}}';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kite-prometheus-api
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kite-prometheus-api
  template:
    metadata:
      labels:
        app: kite-prometheus-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kite-prometheus-api
---
apiVersion: v1
kind: Service
metadata:
  name: kite-prometheus-api
  namespace: monitoring
spec:
  selector:
    app: kite-prometheus-api
  ports:
    - name: http
      port: 9090
      targetPort: http
