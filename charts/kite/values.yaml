# Default values for kite.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  # Release packages set this to their own immutable image repository. When
  # rendering the chart directly from source, set it explicitly.
  repository: ""
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag:

# This will set the deployment strategy. More information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
#
# IMPORTANT: If persistence is enabled and using SQLite with a
# ReadWriteOnce PersistentVolumeClaim, you MUST set this to "Recreate".
# Using "RollingUpdate" will cause pod conflicts during upgrades because multiple
# pods cannot mount the same RWO volume simultaneously.
deploymentStrategy:
  type: Recreate
  # rollingUpdate:
  #   maxSurge: 25%
  #   maxUnavailable: 25%

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

# Images used by the optional browser terminal workflows. Versioned defaults
# avoid silently changing the binaries that receive a user's delegated token.
terminalImages:
  kubectl: alpine/kubectl:1.36.3
  node: busybox:1.37.0

# Defaults to this release's own Kite image. Set explicitly only when the
# transport-only Cluster Agent is published at a different location.
clusterAgentImage: ""

# Optional GitHub-compatible latest-release API. Version checks make no
# outbound request when this is empty.
releaseAPIURL: ""

# Comma-separated additional registry host[:port] values that the optional
# image-tag lookup endpoint may contact. Common public registries are built in;
# private or self-hosted registries must be explicitly enabled here.
imageRegistryHosts: ""

# Optional, operator-owned Umami-compatible analytics endpoint. No analytics
# script is loaded unless both values are configured and analytics is enabled.
analytics:
  enabled: false
  scriptURL: ""
  websiteID: ""
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

debug: false

# External Host for the application
# Used in generate OAuth redirect URLs
# Required. Use the public HTTPS origin without a path.
# Example: https://kite.example.com
host: ""

# Base path for the application
# If you are serving kite under a subpath, set this value accordingly.
# Remember to also set the ingress path to match.
# Example: "/kite"
basePath: ""

# Secret key for protecting one-time tunnel enrollment grants.
# Ignored if using existingSecret
jwtSecret: ""

# This is the key used for encrypting sensitive data
# Change this in production
# Ignored if using existingSecret
encryptKey: ""

oidc:
  issuer: ""
  providerName: "OpenID Connect"
  clientId: ""
  clientSecret: ""
  scopes: "openid profile email offline_access"
  usernameClaim: "email"
  groupsClaim: "groups"
  nameClaim: "name"
  pictureClaim: "picture"
  ca:
    # Optional Secret containing the CA certificate used to verify a private
    # OIDC issuer. The certificate is mounted read-only and never stored in the
    # Kite database.
    existingSecret: ""
    key: ca.crt
    mountPath: /etc/kite/oidc

# OIDC groups allowed to manage shared metadata. Comma-separated values are
# supported; use a JSON string array when a claim value contains separators.
platformAdminGroups: ""
# Exact OIDC subject (`sub`) values with the same platform permission. The same
# legacy-list or JSON string-array syntax is accepted. Configure either or both.
platformAdminSubjects: ""

resourceServer:
  # Enable standards-based Agent/tool access. The URL is the exact protected
  # resource identifier and must be reachable over HTTPS for discovery.
  enabled: false
  url: ""
  issuer: ""
  authorizedClientIds: ""
  jwtAlgorithms: "RS256"

# Secret handling
# By default the chart will create a Kubernetes Secret containing sensitive values.
secret:
  # Create the Secret from chart values (true) or reference an existing Secret (false)
  create: true
  # If set, the deployment will use this existing secret name instead of the generated one (ignored when `create: true`).
  # must contain all required keys.
  #  JWT_SECRET
  #  KITE_ENCRYPT_KEY
  #  OIDC_CLIENT_ID
  #  OIDC_CLIENT_SECRET
  #  DB_DSN (required when db.type is postgres or mysql)
  existingSecret: ""

# Database configuration
# type: sqlite | postgres | mysql
# - sqlite: embedded DB (default). If you choose sqlite and want data to survive pod restarts,
#   enable persistence below so a PVC will be used to store the sqlite file.
# - postgres/mysql: connection fields for external DBs.
db:
  # supported values: sqlite, postgres, mysql
  type: sqlite
  # full DSN string for MySQL/Postgres.
  # when type is mysql/postgres, is required
  # leave empty for use existingSecret to provide it when type is not sqlite
  # Example: "mysql://user:password@tcp(host:port)/dbname"
  dsn: ""
  
  # sqlite-specific options
  sqlite:
    # If true, the chart will create a PVC and mount it into the pod for the sqlite DB file.
    # Set to false to use ephemeral storage (not recommended for production).
    persistence:
      pvc:
        enabled: true
        existingClaim: ""
        # StorageClass to request for the PVC (optional)
        storageClass: ""
        # accessModes for the PVC
        accessModes:
          - ReadWriteOnce
        # requested size
        size: 1Gi
      hostPath:
        enabled: false
        path: /path/to/host/dir
        type: DirectoryOrCreate
      # where to mount inside the container
      mountPath: /data
      # sqlite filename inside the mountPath
      filename: kite.db
    # Additional sqlite database connection options
    # Example: "_pragma=foreign_keys(1)&_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)"
    options: "_pragma=foreign_keys(1)&_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)"
extraEnvs:
  # - name: "EXAMPLE_ENV"
  #   value: "example_value"

# Application configuration from values
# When enabled, the specified sections become read-only in the UI.
# You can either provide an existing Secret containing a config.yaml key,
# or define the configuration inline below.
config:
  enabled: false
  # Name of an existing Secret containing a `config.yaml` key.
  # When set, the inline config below is ignored.
  # The user is responsible for creating and managing this Secret.
  # Example: kubectl create secret generic kite-config --from-file=config.yaml=./my-config.yaml
  existingSecret: ""
  # --- Inline credential-free cluster catalog (used when existingSecret is empty) ---
  # clusters:
  #   - name: production
  #     description: "Production cluster"
  #     connectionMode: direct
  #     apiServerUrl: "https://api.production.example:6443"
  #     caBundle: "<PEM or base64-encoded PEM>"
  #     tlsServerName: "api.production.example"
  #     prometheusURL: "http://prometheus.monitoring.svc:9090"
  #     default: true

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: kite.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  # tls:
  #  - hosts:
  #      - kite.example.com

# Gateway API resources for exposing Kite
# Requires Gateway API CRDs to be installed in the cluster
# For more information: https://gateway-api.sigs.k8s.io/
gateway:
  enabled: false
  # GatewayClass name - must exist in cluster
  # Examples: "istio", "cilium", "nginx", "envoy-gateway"
  className: ""
  # Set to true to create a new Gateway resource
  # Set to false to use an existing Gateway
  create: false
  # Name of the Gateway (used for both creating new or referencing existing)
  name: ""
  # Namespace of existing Gateway (only used when create is false)
  # Defaults to release namespace if not specified
  namespace: ""
  # Annotations for the Gateway (only used when create is true)
  annotations: {}
  # Gateway listeners configuration (only used when create is true)
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      # Optional hostname for the listener
      # hostname: "*.example.com"
      allowedRoutes:
        namespaces:
          from: Same
    # Uncomment to add HTTPS listener
    # - name: https
    #   port: 443
    #   protocol: HTTPS
    #   hostname: "kite.example.com"
    #   allowedRoutes:
    #     namespaces:
    #       from: Same
    #   tls:
    #     mode: Terminate
    #     certificateRefs:
    #       - name: kite-tls-secret
  # HTTPRoute configuration (supports multiple routes)
  httpRoutes:
    - name: kite
      # Annotations for the HTTPRoute
      annotations: {}
      # Hostnames to match (optional, matches all if empty)
      hostnames: []
        # - kite.example.com
      # Routing rules
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          timeouts:
            request: "120s"
    # Example: additional route for different hostname/path
    # - name: kite-api
    #   annotations: {}
    #   hostnames:
    #     - api.example.com
    #   rules:
    #     - matches:
    #         - path:
    #             type: PathPrefix
    #             value: /api

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
startupProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 2
  failureThreshold: 30
# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
