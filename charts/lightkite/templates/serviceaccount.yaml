{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lightkite.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lightkite.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ or .Values.serviceAccount.automount .Values.clusterInventory.enabled }}
{{- end }}
