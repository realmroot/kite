name: E2E

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/e2e.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "*.go"
      - "internal/**"
      - "pkg/**"
      - "ui/**"
      - "e2e/**"
      - "scripts/e2e-*.sh"
      - "scripts/get-version.sh"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/e2e.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "*.go"
      - "internal/**"
      - "pkg/**"
      - "ui/**"
      - "e2e/**"
      - "scripts/e2e-*.sh"
      - "scripts/get-version.sh"

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"

jobs:
  e2e:
    name: E2E / Kubernetes ${{ matrix.kubernetes }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.34"
            suffix: k134
            nodeImage: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
          - kubernetes: "1.35"
            suffix: k135
            nodeImage: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
          - kubernetes: "1.36"
            suffix: k136
            nodeImage: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5

    env:
      E2E_KIND_NAME: kite-e2e-${{ matrix.suffix }}
      E2E_NODE_IMAGE: ${{ matrix.nodeImage }}
      E2E_KUBECONFIG: ${{ github.workspace }}/kite-e2e-${{ matrix.suffix }}.kubeconfig
      KIND_LOGS_DIR: ${{ github.workspace }}/kind-logs
      E2E_PORT: "38080"
      KITE_E2E_USE_SYSTEM_CHROME: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true

      - name: Install deps
        run: make deps

      - name: Install E2E deps
        run: make e2e-install

      - name: Verify Chrome
        run: google-chrome --version

      - name: Install kind
        run: |
          [ "$(uname -m)" = "x86_64" ] && curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          [ "$(uname -m)" = "aarch64" ] && curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-arm64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Start Dex
        run: make e2e-setup-dex

      - name: Run E2E tests
        run: make e2e-run

      - name: Export kind logs
        if: always()
        run: |
          if command -v kind >/dev/null 2>&1 && kind get clusters | grep -qx "${E2E_KIND_NAME}"; then
            kind export logs "${KIND_LOGS_DIR}" --name "${E2E_KIND_NAME}"
          else
            echo "kind cluster ${E2E_KIND_NAME} does not exist"
          fi

      - name: Collect identity provider logs
        if: always()
        run: |
          docker logs kite-e2e-dex > "${GITHUB_WORKSPACE}/kite-e2e-dex.log" 2>&1 || true

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.suffix }}
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ env.KIND_LOGS_DIR }}
            ${{ github.workspace }}/kite-e2e-dex.log
